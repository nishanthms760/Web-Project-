name: Deploy Projects to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize deployment directory
        run: mkdir -p _site

      - name: Build unit-4-pro-2 (Developer Portfolio)
        working-directory: './unit - 4 project - 2/unit-4-pro-2'
        run: |
          npm install
          npm run build
          cp -r dist/* ../../_site/

      - name: Build unit-2-pro-1 (Counter)
        working-directory: './unit - 2 Project - 1/unit-2-pro-1'
        run: |
          npm install
          npm run build
          mkdir -p ../../_site/unit-2-pro-1
          cp -r dist/* ../../_site/unit-2-pro-1/

      - name: Build unit-2-pro-2 (Hobby Showcase)
        working-directory: './unit - 2 project - 2/unit-2-pro-2'
        run: |
          npm install
          npm run build
          mkdir -p ../../_site/unit-2-pro-2
          cp -r dist/* ../../_site/unit-2-pro-2/

      - name: Build unit-3-pro-1 (Calculator)
        working-directory: './unit - 3 project -1/unit-3-pro-1'
        run: |
          npm install
          npm run build
          mkdir -p ../../_site/unit-3-pro-1
          cp -r dist/* ../../_site/unit-3-pro-1/

      - name: Build unit-3-pro-2 (Student Profile)
        working-directory: './unit - 3 project - 2/unit-3-pro-2'
        run: |
          npm install
          npm run build
          mkdir -p ../../_site/unit-3-pro-2
          cp -r dist/* ../../_site/unit-3-pro-2/

      - name: Build unit-4-pro-1 (Verification Form)
        working-directory: './unit - 4 project - 1/unit-4-pro-1'
        run: |
          npm install
          npm run build
          mkdir -p ../../_site/unit-4-pro-1
          cp -r dist/* ../../_site/unit-4-pro-1/

      - name: Build unit-5-pro-1 (Report Card & Semester Results)
        working-directory: './unit - 5 project - 1/unit-5-pro-1'
        run: |
          npm install
          npm run build
          mkdir -p ../../_site/unit-5-pro-1
          cp -r dist/* ../../_site/unit-5-pro-1/

      - name: Build unit-5-pro-2 (StudyFlow Diary Frontend)
        working-directory: './unit - 5 project - 2/unit-5-pro-2'
        run: |
          npm install
          npm run build
          mkdir -p ../../_site/unit-5-pro-2
          cp -r dist/* ../../_site/unit-5-pro-2/

      - name: Copy static HTML projects
        run: |
          cp "unit - 1 project - 1.html" _site/
          cp "unit - 1 project - 2.html" _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
