name: Deploy Projects to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build all frontend projects
        shell: bash
        run: |
          set -e
          mkdir -p _site

          # 1. Build and copy unit-4-pro-2 as primary portfolio site at root
          echo "Building unit-4-pro-2 (Developer Portfolio)..."
          cd "unit - 4 project - 2/unit-4-pro-2"
          npm ci
          npm run build
          cd ../..
          cp -r "unit - 4 project - 2/unit-4-pro-2/dist/"* _site/

          # 2. Build and copy unit-2-pro-1
          echo "Building unit-2-pro-1..."
          cd "unit - 2 Project - 1/unit-2-pro-1"
          npm ci
          npm run build
          cd ../..
          mkdir -p _site/unit-2-pro-1
          cp -r "unit - 2 Project - 1/unit-2-pro-1/dist/"* _site/unit-2-pro-1/

          # 3. Build and copy unit-2-pro-2
          echo "Building unit-2-pro-2..."
          cd "unit - 2 project - 2/unit-2-pro-2"
          npm ci
          npm run build
          cd ../..
          mkdir -p _site/unit-2-pro-2
          cp -r "unit - 2 project - 2/unit-2-pro-2/dist/"* _site/unit-2-pro-2/

          # 4. Build and copy unit-3-pro-1
          echo "Building unit-3-pro-1..."
          cd "unit - 3 project -1/unit-3-pro-1"
          npm ci
          npm run build
          cd ../..
          mkdir -p _site/unit-3-pro-1
          cp -r "unit - 3 project -1/unit-3-pro-1/dist/"* _site/unit-3-pro-1/

          # 5. Build and copy unit-3-pro-2
          echo "Building unit-3-pro-2..."
          cd "unit - 3 project - 2/unit-3-pro-2"
          npm ci
          npm run build
          cd ../..
          mkdir -p _site/unit-3-pro-2
          cp -r "unit - 3 project - 2/unit-3-pro-2/dist/"* _site/unit-3-pro-2/

          # 6. Build and copy unit-4-pro-1
          echo "Building unit-4-pro-1..."
          cd "unit - 4 project - 1/unit-4-pro-1"
          npm ci
          npm run build
          cd ../..
          mkdir -p _site/unit-4-pro-1
          cp -r "unit - 4 project - 1/unit-4-pro-1/dist/"* _site/unit-4-pro-1/

          # 7. Build and copy unit-5-pro-1
          echo "Building unit-5-pro-1..."
          cd "unit - 5 project - 1/unit-5-pro-1"
          npm ci
          npm run build
          cd ../..
          mkdir -p _site/unit-5-pro-1
          cp -r "unit - 5 project - 1/unit-5-pro-1/dist/"* _site/unit-5-pro-1/

          # 8. Build and copy unit-5-pro-2 (Frontend only)
          echo "Building unit-5-pro-2..."
          cd "unit - 5 project - 2/unit-5-pro-2"
          npm ci
          npm run build
          cd ../..
          mkdir -p _site/unit-5-pro-2
          cp -r "unit - 5 project - 2/unit-5-pro-2/dist/"* _site/unit-5-pro-2/

          # 9. Copy static HTML projects
          cp "unit - 1 project - 1.html" _site/
          cp "unit - 1 project - 2.html" _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
